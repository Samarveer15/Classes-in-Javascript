<!DOCTYPE html>
<html>
    <body>
        <h2>JJavascript Class Inheritance</h2>
        <p>Use the "extends" keyword to inherit all methods from another class</p>
        <p>Use the "super" method to call the parent's constructor function.</p>
        <p id="details"></p>
        <script>
            class car {
                constructor(brand) {
                    this.carname = brand;
                }
                present() {
                    return 'I have a ' + this.carname;
                }
            }
            class Modal extends car {
                constructor(brand, mod) {
                    super(brand);
                    this.modal = mod;
                }
                show() {
                    return this.present() + ', it is a '  + this.modal; 
                }
            }
            let myCar = new Modal("Ford", "Mustang");
            document.getElementById("details").innerHTML = myCar.show();
        </script>
    </body>
</html>
